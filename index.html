<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Scanner AI - RSI Indicators</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff00;
            text-align: center;
        }
        .scanner-box {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #00ff00;
        }
        .indicator {
            padding: 10px;
            margin: 10px 0;
            background: #333;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Stock Scanner AI</h1>
        <h2>RSI Indicator Dashboard</h2>
        
        <div class="scanner-box">
            <h3>Technical Indicators</h3>
            <div class="indicator">📊 RSI (Relative Strength Index)</div>
            <div class="indicator">📈 MACD (Moving Average Convergence Divergence)</div>
            <div class="indicator">🌊 Bollinger Bands</div>
            <div class="indicator">⭐ Astrology-Based Signals</div>
        </div>
        
        <div class="scanner-box">
            <h3>Market Status</h3>
            <p>Real-time stock analysis with AI-powered predictions</p>
            <p>Last updated: <span id="time"></span></p>
        </div>
    </div>
    
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
    </script>
</body>
</html>
